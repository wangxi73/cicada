<header class="top">
  <nav class="wrap" aria-label="{{t.nav_label}}">
    <a class="brand" href="{{HOME}}"><img src="{{ROOT}}icon.svg" alt="" width="30" height="30"><b>{{t.brand_name}}</b><span>{{t.brand_sub}}</span></a>
    <div class="navlinks desk">
      <a href="{{HOME}}#how">{{t.nav_how}}</a>
      <a href="{{HOME}}start/"{{START_CURRENT}}>{{t.nav_start}}</a>
      <a href="{{DOWNLOAD_PAGE}}"{{DOWNLOAD_CURRENT}}>{{t.nav_download}}</a>
      <a href="{{HOME}}#faq">{{t.nav_faq}}</a>
      <a href="{{REPO}}">GitHub</a>
    </div>
    <details class="lang">
      <summary aria-label="{{t.lang_label}}: {{t.lang_name}}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9s1.3-6.4 3.8-9z"/></svg>
        <span class="lang-name">{{t.lang_name}}</span>
        <svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </summary>
      <div class="lang-menu">
        <b class="lang-title">{{t.lang_label}}</b>
        {{LANG_LINKS}}
      </div>
    </details>
    <a class="btn btn-dark desk" href="{{DOWNLOAD_PAGE}}">{{t.download_free}}</a>
    <div class="navlinks phone"><a href="{{HOME}}start/"{{START_CURRENT}}>{{t.nav_start}}</a><a href="{{DOWNLOAD_PAGE}}"{{DOWNLOAD_CURRENT}}>{{t.nav_download}}</a></div>
  </nav>
  <div class="suggest" role="region" aria-label="{{t.suggest_label}}" hidden>
    <div class="wrap"><span class="msg"></span><a class="go" href="#"></a><button type="button" class="x" aria-label="{{t.suggest_close}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  </div>
</header>
<script>
// Offer the visitor's own language when the page isn't in it. No redirect: links and search results stay as they are.
(function () {
  var alts = {{ALTS_JSON}}, here = document.documentElement.lang.slice(0, 2), key = 'cicada-lang-dismissed';
  var text = {
    zh: ['本页有简体中文版本。', '切换到中文'], en: ['This page is available in English.', 'Switch to English'],
    ja: ['このページは日本語でもご覧いただけます。', '日本語で表示'], ko: ['이 페이지는 한국어로도 볼 수 있습니다.', '한국어로 보기']
  };
  try { if (localStorage.getItem(key)) return; } catch (e) {}
  var want = null;
  (navigator.languages || [navigator.language || '']).some(function (l) {
    var c = String(l).toLowerCase().slice(0, 2);
    if (alts[c]) { want = c; return true; }
    return false;
  });
  if (!want || want === here) return;
  var bar = document.querySelector('.suggest');
  bar.querySelector('.msg').textContent = text[want][0];
  bar.querySelector('.msg').lang = want;
  var go = bar.querySelector('.go');
  go.textContent = text[want][1]; go.href = alts[want]; go.lang = want; go.hreflang = want;
  bar.querySelector('.x').addEventListener('click', function () {
    bar.hidden = true;
    try { localStorage.setItem(key, '1'); } catch (e) {}
  });
  bar.hidden = false;
})();
// Close the language menu on Escape or a click elsewhere.
document.addEventListener('click', function (e) {
  document.querySelectorAll('details.lang[open]').forEach(function (d) { if (!d.contains(e.target)) d.open = false; });
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') document.querySelectorAll('details.lang[open]').forEach(function (d) { d.open = false; d.querySelector('summary').focus(); });
});
</script>
